name: Renovate

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      log-level:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info
  issues:
    types: [edited]

permissions:
  contents: read
  packages: read

jobs:
  renovate:
    if: github.event_name != 'issues' || github.event.issue.title == 'Dependency Dashboard'
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RS_TOKEN_APP_ID }}
          private-key: ${{ secrets.RS_TOKEN_APP_PK }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM_COMMIT: enabled
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          # GitHub Packages' npm registry doesn't accept App installation tokens, so lookups
          # (hostRules) and npm's own lockfile updates (.npmrc) both use the job's GITHUB_TOKEN.
          RENOVATE_SECRETS: '{"PACKAGES_TOKEN": "${{ secrets.GITHUB_TOKEN }}"}'
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"GITHUB_PACKAGES_TOKEN": "${{ secrets.GITHUB_TOKEN }}"}'
        with:
          token: ${{ steps.app-token.outputs.token }}
