name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

# Placeholders: the build only needs these to be set, not to point anywhere real.
env:
  PUBLIC_STYTCH_CLIENT_ID: connected-app-test-ci
  PUBLIC_KBDB_API_BASE_PATH: https://api.example.invalid
  PUBLIC_OIDC_ISSUER: https://auth.example.invalid

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run check

  test:
    name: Test
    runs-on: ubuntu-latest
    # Chromium's system packages come preinstalled; installing them with apt on
    # the runner depends on a mirror that is sometimes very slow.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.GITHUB_TOKEN }}

      # A no-op while the image matches the lockfile's Playwright; downloads the
      # right browser if they drift apart.
      - run: npx playwright install chromium

      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          packages-token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
